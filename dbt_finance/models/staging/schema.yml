version: 2

models:
  - name: stg_commodity_prices
    description: Prix journaliers typés et dédupliqués par symbole/date.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - symbol
            - date
    columns:
      - name: symbol
        tests:
          - not_null
      - name: date
        tests:
          - not_null
      - name: close
        tests:
          - not_null

  - name: stg_benchmarks
    description: Benchmarks typés et dédupliqués.
    columns:
      - name: benchmark_id
        tests:
          - not_null
      - name: date
        tests:
          - not_null

  - name: stg_news
    description: Articles RSS nettoyés et dédupliqués.
    columns:
      - name: article_id
        tests:
          - not_null
          - unique
      - name: title
        tests:
          - not_null
      - name: published_at
        tests:
          - not_null

  - name: stg_pipeline_logs
    description: Logs pipeline typés.
    columns:
      - name: run_id
        tests:
          - not_null
      - name: task_name
        tests:
          - not_null
      - name: duration_seconds
        description: Durée de la tâche en secondes.

  - name: stg_article_commodity_relevance
    description: Similarités article-matière première typées.
    columns:
      - name: article_id
        tests:
          - not_null
      - name: commodity_id
        tests:
          - not_null

  - name: stg_news_sentiment
    description: Scores de sentiment article.
    columns:
      - name: article_id
        tests:
          - not_null
      - name: sentiment_score
        tests:
          - not_null
