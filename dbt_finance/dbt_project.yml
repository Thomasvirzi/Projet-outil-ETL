name: dbt_finance
version: 1.0.0
config-version: 2

profile: dbt_finance

model-paths:
  - models
test-paths:
  - tests
macro-paths:
  - macros
target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  raw_dataset: raw
  mart_dataset: mart
  default_start_date: "2020-01-01"
  backtest_fee_rate: 0.001
  backtest_slippage_rate: 0.0005
  backtest_periods_per_year: 252

models:
  dbt_finance:
    landing:
      +materialized: view
      +schema: landing
    staging:
      +materialized: view
      +schema: staging
    warehouse:
      +materialized: table
      +schema: warehouse
    marts:
      +materialized: table
      +schema: marts
