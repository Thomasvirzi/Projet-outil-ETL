# Univers d'actions du projet.
#
# Rôle métier :
# - equities : univers configurable d'actions individuelles suivies via yfinance.
# - market_benchmark : indice de marché de référence (Buy & Hold), configurable.
# - portfolio : paramètres par défaut du portefeuille agrégé (equal-weight / inverse-vol).
#
# Important :
# Contrairement aux matières premières (contrats futures continus), les actions ont des
# dividendes et des splits. Les calculs de rendement doivent utiliser les prix ajustés
# (adjusted_close), pas le close brut.
