  ticker: SPY
  name: SPDR S&P 500 ETF Trust
  currency: USD
  description: "Benchmark de marché configurable, Buy & Hold simple."

portfolio:
  reference_currency: EUR
  allocation: equal
  rebalance: monthly
  max_position_weight: 0.15
  max_positions: 20
  cash_reserve: 0.0
  allow_short: false
  leverage: 1.0
  vol_lookback: 60
  min_vol_observations: 20
  transaction_cost_bps: 0

execution:
  initial_capital: 10000
  fee_rate: 0.001
  slippage_rate: 0.0005
  allow_short: false
