# Sources RSS retenues pour le MVP.
#
# Choix métier :
# - S&P Global : qualité institutionnelle et couverture multi-commodities.
# - Investing.com : volume, sentiment de marché et analyses.
# - Barchart : futures, grains, metals, energy et soft commodities.
# - CME Group : contexte futures listés CME/CBOT/NYMEX/COMEX.
# - Nasdaq : complément généraliste commodities et contexte macro.
#
# Important :
# Les flux RSS sont collectés en forward collection. Le backfill historique RSS
# reste limité par la profondeur de chaque feed.
rss_sources:
  - source_id: spglobal_commodity_insights
    feed_id: spglobal_oil
    name: S&P Global - Latest Oil Headlines
    source_name: S&P Global Commodity Insights
    url: https://www.spglobal.com/commodityinsights/en/rss-feed/oil
    category: oil
    language: en
    priority: 1
    quality: very_high
    coverage: [oil, energy]
    recommended_use: [supply_shock_score, geopolitical_risk_score, news_pressure_score, demand_shock_score]
    requires_deduplication: true
    enabled: false  # 403 Forbidden sans accès/API S&P Global; garder en référence mais ne pas collecter par défaut.

